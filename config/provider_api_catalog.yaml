  nuri:
    service_name_ko: 조달청_누리장터 민간입찰공고서비스
    status: DOCUMENTED
    base_url: https://apis.data.go.kr/1230000/ao/PrvtBidNtceService
    source: https://www.data.go.kr/data/15129456/openapi.do
    checked_on: '2026-10-12'
    swagger_sha256: 7b3bc3e4e159d763aad9f02f8402d0ddd2e1ede3da957b42857b21d5341a790b
    notes:
    - 활용신청은 사용자가 PROVIDER_DATA_GO_KR_SERVICE_KEY 계정으로 했다(2026-10-12 사용자 확인).
    - 참고문서 '조달청_OpenAPI참고자료_누리장터_민간입찰공고서비스_1.0.docx'(sha256 12163aa98fdc24bc…) 기준으로 공사 목록 inqryDiv는 1=등록일시, 2=공고게시일시, 3=개찰일시, 4=입찰공고번호다. inqryBgnDt/inqryEndDt는 YYYYMMDDHHMM이며 조회구분 1·2·3에서 필수다.
    - 면허제한·참가가능지역 조회의 inqryDiv는 1=등록일시, 2=입찰공고번호(bidNtceOrd 함께)다(참고문서).
    - 응답 일시는 'YYYY-MM-DD HH:MM:SS' 형식이다(참고문서). refAmt는 투찰 상한인 기준금액, asignBdgtAmt는 배정예산금액이다. 추정가격 필드는 없다.
    - rgnLmtDivNm은 '투찰제한' 또는 '공고서 참조'로만 표기된다(참고문서). 참가가능지역 이름은 별도 오퍼레이션에서 받는다.
    - aptCeoAdrs는 공고기관(아파트) 주소이며 공사현장 주소가 아니다. cnstwkDtlList는 [순번^공사명^공사현장명^준공기한일자] 반복 형식이다(참고문서).
