    notes:
    - 활용신청은 사용자가 PROVIDER_DATA_GO_KR_SERVICE_KEY 계정으로 했다(2026-10-12 사용자 확인).
    - strSdate/strEdate는 '조회 시작월/종료월'로만 적혀 있고 값 형식은 명세에 없다. 포털 참고문서도 없다.
    - 2026-10-12 실응답에서 YYYYMM(202610~202610)은 0건이었고, YYYYMMDD(20261001~20261012)는 35건이 왔다. 35건의 annday3(공고일자)는 모두 범위 안이었다. 수집은 YYYYMMDD로 한다.
    - 같은 응답의 category 값은 '공사영역'(공고번호 E로 시작, 14건)과 '자재'(G로 시작, 21건)뿐이었다. 공사영역에는 공사와 용역이 섞여 있고 둘을 나누는 필드는 없다.
    - 공사영역 14건 모두 estprc3(추정가격(공사)) = estprcv3(부가세포함추정가격(공사)) × 1.1이었다. 라벨과 크기 관계가 반대이므로 어느 값도 추정가격으로 쓰지 않고 표기값 그대로 따로 보관한다.
    - limreg4(지역제한)는 35건 모두 공백이었다. 면허 필드는 없다. 공사영역의 공고일자·입찰신청·투찰 일시는 접미사 3 필드(annday3·applsdt3·appledt3·subsdt3·subedt3)에 있다.
    - Swagger상 전체 건수는 body.paginginfo.totalCnt다. 표준 body.totalCount 위치가 아니다.
    - category(입찰정보범주)의 값 목록은 명세에 없다. 필드 접미사(2 자재, 3 공사, 4 경매)는 필드 설명에서 읽은 묶음이다.
    - dprtnm·name·ofcphn·email은 담당자 정보라 화면·API에 내보내지 않는다.
