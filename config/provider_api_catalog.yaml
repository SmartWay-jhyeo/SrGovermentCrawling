    notes:
    - 포털 설명의 업무구분은 물품/용역이지만 같은 Swagger에 시설(Fclty) operation이 있다. 시설 목록의 busiDivs는 공사/용역이다.
    - 날짜 파라미터 형식은 Swagger에 없다. 2026-10-08 실응답에서 anmtDateBegin/anmtDateEnd=YYYYMMDD로 조회하니 범위 안 공고만 반환됐고 끝 날짜도 포함됐다.
    - Swagger 원문에서 anmtDateEnd 설명도 '공고일자시작'으로 표기돼 있다. 실응답은 종료일로 동작했다(표본 1회 조건).
    - 활용신청은 사용자가 PROVIDER_DATA_GO_KR_SERVICE_KEY 계정으로 했다(2026-10-08 사용자 확인).
    - 목록 g2bPblancNo는 pblancYear + 상세 g2bPblancNo 형식이다(관측). 나라장터 차세대 번호(R..)와 형식이 다르다.
    - 목록은 같은 pblancNo의 공고 버전(예 긴급공고 차수1, 취소공고 차수2)을 별도 행으로 준다. 상세 필수 키 6개로 구분한다.
    - 상세 lcnsLmttList에는 ^와 | 구분자가 섞여 있다. 복수면허 AND/OR 의미는 미검증이다. scale '/0㎡'처럼 값이 있어도 의미 없는 자리표시자가 있다.
    - 물품·용역(Dmstc/Outnatn) operation은 이번 공사 목적 범위가 아니어서 제외했다.
