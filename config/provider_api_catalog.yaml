  kepco:
    service_name_ko: 한국전력공사_전자입찰계약정보(전력데이터 개방포털)
    status: DOCUMENTED
    base_url: https://bigdata.kepco.co.kr/openapi/v1
    source: https://bigdata.kepco.co.kr/cmsmain.do?scode=S01&pcode=000493&pstate=contract&redirect=Y
    checked_on: '2026-10-20'
    notes:
    - data.go.kr 게이트웨이가 아니다. 공공데이터포털 목록(15148223)은 이 포털로 가는 LINK형이다. 인증키(40자리)는 개방포털에서 받고 KEPCO_API_KEY로만 넣는다.
    - 개방포털의 로그인·회원가입은 en-ter.co.kr(한전 에너지마켓플레이스, 한전통합회원 SSO)로 넘어간다. 로그인 뒤 en-ter의 /loginSsoEtc.do?ssoTarget=bigdata 로 들어가 키를 받는다(2026-10-20 사용자 발급).
    - 페이지 파라미터가 없다. 기간 전체가 {"data":[...]} 한 번에 온다. resultCode·totalCount가 없으므로 data 배열 길이를 건수로 쓴다.
    - 2026-10-06~10-20 1회 실응답: 753행, 4,716,229바이트(하루 약 54행·0.35MB). noticeDate가 모두 범위 안이었다. 수집은 하루 단위로 한다(MAX_RESPONSE_BYTES 안).
    - 오류는 HTTP 401에 {"errCd","errMsg"}다. 틀린 키는 errCd 401 InvalidApiKeyException, 90일 초과 기간은 errCd 400 'The date range too long(max 90 days)'였다(2026-10-20 각 1회).
    - 공고가 없는 날은 HTTP 404 {"errCd":"404","errMsg":"NotFound"}다(NAS 2026-10-21: 주말 10/17·18, 아직 안 올라온 10/21). 데이터 없음(03)으로 읽는다. 그날 공고는 하루쯤 늦게 올라온다(10/20 19시 조회에 10/20 공고 0건, 10/21 밤에는 124건). 최근 3일 재조회로 메운다.
    - 한 번은 HTTP 401에 빈 본문(2바이트)이 왔고 같은 날을 다시 부르니 정상이었다(2026-10-21, 10/20분). 일시 오류로 보이며 다음 실행이 다시 읽는다.
    - 금액이 JSON 실수로 오는 행이 있다(10/16 presumedAmount 1081.3). 이 형태에서는 문제로 보지 않고 문자열로 보관한다.
    - 면허·참가지역 구조 필드가 없다. bidAttendRestrict는 0/753, deliveryLocation은 공사 전부 '-'다. 참가자격은 etc(입찰참가자격) 자유문장이고 대부분 '공고문 참조'다. 실제 조건은 첨부 공고문(filenlink1~5, srm.kepco.net)에 있다.
    - companyId COM04(한국남부발전)는 data.go.kr 남부발전(kospo) 출처와 겹친다. 같은 공고가 두 번 보이지 않게 정규화에서 뺀다.
    - creatorName(계약담당자)·moreInformation(추가정보제공처)·contractReqDepartmentName은 담당자 정보일 수 있어 화면·API에 내보내지 않는다.
    - 같은 no가 다른 공고일·첨부로 두 번 온 사례가 2건 있었다(재공고로 보임, 미확인). createDatetime이 늦은 행을 최신으로 본다.
    - 현장 위치 필드가 없어 placeName(발주기관)의 지역본부·발전본부 이름으로 현장 시·도를 추정한다(추천 범위에만 쓰고 자격 판정에는 쓰지 않는다). 여러 시·도를 맡는 본부는 후보 시·도를 모두 두고, 전부 범위 밖일 때만 뺀다. 전국 단위 건설본부는 추정하지 않는다.
