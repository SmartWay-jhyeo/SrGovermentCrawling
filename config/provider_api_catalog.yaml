    - 포털은 Swagger 없이 요청·응답 표를 게시한다. 이 항목은 포털 표와 참고문서 '활용가이드(GW)_공사입찰정보V1.1_중부.docx'를 옮겼다.
    - 참고문서는 SSL 없음·http 주소를 적었지만 포털 요청주소는 https://apis.data.go.kr/B552521/cbid/getData다. https만 쓴다.
    - strDateS/strDateE는 YYYYMMDD이며 필수다. 교환 형식은 XML만 문서화돼 있고, 예제의 totalCount는 header 안에 있다.
    - 일시 필드(bidStart·bidJoinEnd·bidThrowEnd 등)는 YYYYMMDDHHMMSS 14자리다(참고문서 예제).
    - entPriv(입찰참가자격 기타)는 자유문이며 담당자 연락처가 섞일 수 있다. creUser는 공고등록자 사번이라 내보내지 않는다.
    - 2026-10-12 실호출 4회: 인증은 통과했다. 참고문서 예시 기간(20140101~20141231)은 resultCode 00, header.totalCount 285로 정상이었다. 20261001~20261012(100행·10행)와 20250101~20251231은 모두 resultCode 02 '데이터베이스 에러입니다.'였다. 최근 공고를 받을 수 없어 수집에 연결하지 않는다(BLOCKED).
    - 정상 응답의 demandName(계약의뢰부서)에는 담당자 이름이 괄호로 붙어 있다. 내보낼 때 이름을 제거해야 한다.
