  response_format:
  - 모든 호출 HTTP 200, Content-Type application/json;charset=UTF-8, header.resultCode 00 / resultMsg 정상
  - items는 리스트. 참고자료·Swagger의 items.item 구조와 다름
  - 정상 무자료는 resultCode 00 + totalCount 0. 코드 03은 관측되지 않음
  - 숫자형 envelope 필드(totalCount, pageNo, numOfRows)는 JSON 정수, 항목 값은 모두 문자열
  - 오류 응답(인증 실패·쿼터 초과 등)은 이번에 발생하지 않아 형식 미확인
gateway:
  allowed_hosts:
  - apis.data.go.kr
  scheme: https
  scheme_note: 참고자료 docx 예시는 http, 포털 Swagger schemes는 https와 http. 클라이언트는 https만 사용한다(TLS 검증 유지).
  auth_note: '포털 Swagger 파라미터명은 서비스별 serviceKey 또는 ServiceKey, 참고자료는 ServiceKey. 포털 가이드: Swagger 호출 시 일반 인증키(Decoding) 입력. 클라이언트는 Decoding 키를 한 번만 URL 인코딩한다.'
  response_format_note: type=json이면 JSON, 미지정이면 XML(참고자료). 오류 응답 envelope 형식은 문서에 없다.
  portal_error_codes:
  - message: APPLICATION_ERROR
    code: '01'
    description: GW 내부 처리 중 예기치 않은 오류가 발생했습니다. 잠시 후 다시 호출하고, 문제가 반복되면 활용지원센터로 문의해 주세요.
  - message: HTTP_ERROR
    code: '04'
    description: 허용되지 않은 HTTP 요청이거나 기관 API 응답 처리에 실패했습니다. 요청 방식과 호출 URL을 확인해 주세요.
  - message: SERVICETIMEOUT_ERROR
    code: '05'
    description: 기관 API 또는 GW 연계 서비스와의 연결에 실패했거나 응답 대기시간을 초과했습니다. 잠시 후 다시 호출해 주세요.
  - message: INVALID_REQUEST_PARAMETER_ERROR
    code: '10'
    description: 요청 파라미터의 값이나 형식이 올바르지 않습니다. API 명세에서 파라미터 이름, 형식 및 허용값을 확인해 주세요.
  - message: NO_OPENAPI_SERVICE_ERROR
    code: '12'
    description: 요청한 오픈API 서비스가 존재하지 않거나 폐기되었습니다. 호출 URL에 오타가 없는지 확인해 주세요.
  - message: SERVICE_KEY_IS_NULL
    code: '20'
    description: 요청에 API 인증키가 포함되지 않았습니다. 공공데이터포털에서 발급받은 인증키를 요청 파라미터에 포함해 주세요.
  - message: PERMISSION_DENIED
    code: '20'
    description: GW 접근 권한 검사에서 요청이 거부되었습니다. 해당 API의 활용신청 및 접근 권한을 확인해 주세요.
  - message: LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR
    code: '22'
    description: API 서비스의 일일 호출 허용량을 초과했습니다. 호출량이 초기화된 이후 다시 이용하거나 트래픽 증설을 신청해 주세요.
  - message: LIMITED_NUMBER_OF_SERVICE_REQUESTS_PER_SECOND_EXCEEDS_ERROR
    code: '23'
    description: 짧은 시간에 많은 요청이 발생하여 초당 호출 허용량을 초과했습니다. 잠시 후 다시 호출해 주세요.
  - message: BLACKLIST_IP_ACCESS_ERROR
    code: '29'
    description: 차단된 IP에서 호출한 요청입니다. 호출 서버의 IP를 확인하고, 차단 해제가 필요한 경우 활용지원센터로 문의해 주세요.
  - message: SERVICE_ACCESS_DENIED_ERROR
    code: '20'
    description: 해당 API 서비스에 대한 이용 권한이 확인되지 않습니다. 활용신청 여부와 승인 또는 일시중지 상태를 확인해 주세요.
  - message: SERVICE_KEY_IS_NOT_REGISTERED_ERROR
    code: '30'
    description: 등록되지 않은 API 인증키입니다. 인증키가 정확한지와 해당 서비스의 활용신청이 정상적으로 완료되었는지 확인해 주세요.
  - message: DEADLINE_HAS_EXPIRED_ERROR
    code: '31'
    description: API 인증키의 사용 기한이 만료되었습니다. 공공데이터포털에서 이용 기간을 확인하거나 갱신해 주세요.
  guide_error_codes:
  - code: '01'
