count_definitions:
  totalCount:
    documented: 전체 결과 수 / 데이터 총 개수
    meaning_status: UNVERIFIED
    rule: 조회조건 결과 행 수로만 해석. 공고 수·개찰단위 수·투찰 수와 동일시하지 않는다.
  prtcptCnum:
    documented: 참가업체수(개찰결과 목록, 낙찰 목록)
    meaning_status: LIVE_VERIFIED
    rule: 공식 참여수로 별도 저장. 무효·공동수급·중복 포함 범위 미기재. 명부 수와 다르면 재검토 대상.
    observed_meaning: 개찰완료 명부(getOpengResultListInfoOpengCompt)의 전체 행 수와 같다. 비고가 정상·낙찰하한선 미달·전자입찰취소신청인 행을 모두 포함한다. 유효 투찰 수(정상)가 아니다
    evidence: 5개 개찰단위에서 prtcptCnum = 명부 행 수 = 고유 사업자번호 수
    unverified: 공동수급 투찰 표현, 무효 처리 행의 표기, 재입찰 회차별 값
  roster_row_count:
    documented: 개찰완료 목록(getOpengResultListInfoOpengCompt) 행 수 — 내부 계산값
    meaning_status: UNVERIFIED
    rule: 모든 페이지 수집(완전성 검사 통과) 시에만 산출. 페이지 totalCount와 구분.
  roster_unique_bizno:
    documented: 명부 prcbdrBizno 고유 수 — 내부 계산값
    meaning_status: UNVERIFIED
    rule: 공동수급 구성원 표현 방식 미확인. 확인 전까지 투찰 주체 수로 단정하지 않는다.
  valid_bid_count:
    documented: 문서에 해당 필드 없음
    meaning_status: UNVERIFIED
    rule: 비고(rmrk) 등으로 유효/무효 구분이 확인되기 전에는 산출하지 않는다.
  zero_policy: 빈 응답·조회실패·미개찰·미조회는 0이 아니다. 명시적으로 0이 관측된 값만 0으로 기록한다.
