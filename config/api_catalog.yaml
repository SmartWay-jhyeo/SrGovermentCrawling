  - code: '07'
    name: 입력범위값 초과 에러
    description: 요청하신 OpenAPI의 파라미터 입력값 범위가 초과 되었습니다.
    action: 기술문서를 다시 한번 확인하여 주시기 바랍니다.
  - code: 08
    name: 필수값 입력 에러
    description: 요청하신 OpenAPI의 필수 파라미터가 누락되었습니다.
    action: 기술문서를 다시 한번 확인하여 주시기 바랍니다.
  - code: '10'
    name: 잘못된 요청 파라미터 에러
    description: OpenAPI 요청시 ServiceKey 파라미터가 없음
    action: -OpenAPI 요청시 ServiceKey 파라미터가 누락되었습니다. / -OpenAPI 요청 URL을 확인하시기 바랍니다.
  - code: '11'
    name: 필수 요청 파라미터가 없음
    description: 요청하신 OpenAPI의 필수 파라미터가 누락되었습니다.
    action: 기술문서를 다시 한번 확인하여 주시기 바랍니다.
  - code: '12'
    name: 해당 오픈API 서비스가 없거나 폐기됨
    description: OpenAPI 호출시 URL이 잘못됨
    action: -제공기관 관리자에게 폐기된 서비스인지 확인바랍니다. / 폐기된 서비스가 아니면 개발가이드에서 OpenAPI요청 URL을 다시 확인하시기 바랍니다.
  - code: '20'
    name: 서비스 접근 거부
    description: 활용승인이 되지 않은 OpenAPI호출
    action: -OpenAPI활용신청정보의 승인상태를 확인하시기 바랍니다. / -활용신청에 대해 제공기관 담당자가 확인 후 '승인'이후 부터 사용할 수 있습니다. / -신청 후 2~3일 소요되고 결과는 회원가입 시 등록한 e-mail로 발송됩니다.
  - code: '22'
    name: 서비스 요청 제한 횟수 초과 에러
    description: 일일 활용건수가 초과함(활용건수 증가 필요)
    action: -OpenAPI활용신청정보의 서비스 상세기능별 일일 트래픽량을 확인하시기 바랍니다. / -개발계정의 경우 제공기관에서 정의한 트래픽을 초과하여 활용할 수 없습니다. / -운영계정의 경우 변경신청을 통해서 일일트래픽량을 변경 할 수 있습니다.
  - code: '30'
    name: 등록되지 않은 서비스 키
    description: 잘못된 서비스키를 사용하였거나 서비스키를 URL인코딩하지
    action: -OpenAPI활용신청정보의 발급받은 서비스키를 다시 확인하시기 바랍니다. / - 서비스키 값이 같다면 서비스키가 URL 인코등 되었는지 다시 확인하시기 바랍니다.
  - code: '31'
    name: 기한 만료된 서비스 키
    description: OpenAPI 사용기간이 만료됨 / (활용연장신청 후 사용가능)
    action: -OpenAPI 활용신청정보의 활용기간을 확인합니다. / -활용기간이 지난 서비스는 이용할 수 없으며 연장신청을 통해 승인 받은 후 다시 이용가능 합니다.
  - code: '32'
    name: 등록되지 않은 도메인명 또는 IP주소
    description: 활용신청한 서버의 IP와 실제 OpenAPI호출한 서버가 다를 경우
    action: -OpenAPI 활용신청정보의 등록된 도메인명이나 IP주소를 다시 확인합니다. / -IP나 도메인의 정보를 변경하기 위해 변경신청을 할 수 있습니다.
